spring.application.name=finledger

# Database
# Defaults match .env.example for local development. Docker will override these with environment variables.
# sslMode and allowPublicKeyRetrieval are for local dev only.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/finledger?sslMode=DISABLED&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:finledger}
spring.datasource.password=${DB_PASSWORD:finledger_dev}

# JPA / Hibernate
# Flyway creates and changes tables. Hibernate only checks that the Java classes match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Store java.time.Instant in DATETIME(6) columns (always UTC)
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# Flyway migrations live in src/main/resources/db/migration
spring.flyway.locations=classpath:db/migration

# Actuator: expose only the health and info endpoints
management.endpoints.web.exposure.include=health,info

# Auth
# The fallback secret is for local development only. Docker passes a real one from .env.
finledger.auth.jwt-secret=${JWT_SECRET:local-dev-only-secret-do-not-use-in-production-0123456789}
# ACCESS_TOKEN_TTL can be set to something like 20s to watch silent refresh happen quickly
finledger.auth.access-token-ttl=${ACCESS_TOKEN_TTL:15m}
finledger.auth.refresh-token-ttl=30d
# Secure cookies only travel over HTTPS. Keep false for http://localhost, set true when deployed with HTTPS.
finledger.auth.cookie-secure=${COOKIE_SECURE:false}
