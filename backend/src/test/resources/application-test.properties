# Used by tests marked @ActiveProfiles("test").
# Points at a separate finledger_test database so tests can wipe tables without touching dev data.
# Everything not listed here (username, password, JWT settings) comes from application.properties.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3307/finledger_test?sslMode=DISABLED&allowPublicKeyRetrieval=true}

# Mutual funds: use support/FakeNavSource instead of mfapi.in, and don't pre-fetch anything at startup
finledger.mf.source=fake
finledger.mf.warmup=false
